name: HCBS CI Pipeline

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # SETUP stage
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pylint pytest pytest-html

      # LINT & CODE QUALITY stage
      - name: Run flake8
        run: |
          # Fails if there are syntax errors or undefined names
          flake8 src/ --max-line-length=120 --exclude=__pycache__ --count --statistics
      
      - name: Run pylint
        run: |
          # Fails if the score is under 7.0
          pylint src/ --fail-under=7.0

      # TEST stage
      - name: Run unit and boundary tests
        env:
          CI: "true"
        run: |
          # Runs all tests in memory
          pytest tests/test_models.py tests/test_boundary_negative.py -v --tb=short

      - name: Run integration tests
        env:
          CI: "true"
        run: |
          pytest tests/test_integration.py -v --tb=short
